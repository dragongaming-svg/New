
name: Build QuickTap APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -1)
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/QuickTapShortcut
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickTapShortcut-APK
          path: source/QuickTapShortcut/app/build/outputs/apk/debug/*.apk
          
